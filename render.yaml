services:
  - type: web
    name: appimgvid-backend
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /
    envVars:
      - key: LLAMA_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
